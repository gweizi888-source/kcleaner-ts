name: Build KCleanerTS tipa

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.2"

      - name: Install ldid
        run: |
          brew install libplist openssl@3 pkg-config
          git clone --depth 1 https://github.com/opa334/ldid.git /tmp/ldid-src
          cd /tmp/ldid-src && make -j"$(sysctl -n hw.ncpu)"
          install -m 755 /tmp/ldid-src/ldid /usr/local/bin/ldid
          ldid 2>&1 | head -n 1 || true

      - name: Build kcleaner_ts
        run: make clean && make

      - name: Verify Mach-O
        run: file kcleaner_ts && otool -hv kcleaner_ts | head -n 5

      - name: Sign for TrollStore
        run: make trollsign

      - name: Package tipa
        run: |
          chmod +x trollstore/pack-tipa.sh
          ./trollstore/pack-tipa.sh

      - name: Upload tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: KCleanerTS-tipa
          path: build/KCleanerTS.tipa
          if-no-files-found: error

      - name: Upload bare binary
        uses: actions/upload-artifact@v4
        with:
          name: kcleaner_ts-arm64
          path: kcleaner_ts
