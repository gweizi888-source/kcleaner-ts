name: Build KCleanerTS tipa

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install ldid
        run: |
          brew install ldid
          which ldid
          ldid 2>&1 | head -n 1 || true

      - name: Build kcleaner_ts
        run: make clean && make

      - name: Verify Mach-O
        run: |
          file kcleaner_ts
          otool -l kcleaner_ts | awk '/LC_BUILD_VERSION/{getline; getline; print}' | head -n 3

      - name: Sign for TrollStore
        run: |
          ldid -S kcleaner_ts
          ldid -S trollstore/entitlements.plist kcleaner_ts
          ldid -e kcleaner_ts | head -n 8

      - name: Package tipa
        run: |
          chmod +x trollstore/pack-tipa.sh
          ./trollstore/pack-tipa.sh

      - name: Upload tipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: KCleanerTS-tipa
          path: build/KCleanerTS.tipa
          if-no-files-found: error

      - name: Upload bare binary
        uses: actions/upload-artifact@v4
        with:
          name: kcleaner_ts-arm64
          path: kcleaner_ts
